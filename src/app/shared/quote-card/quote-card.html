<!-- Quote Card -->
<div
  class="quote-card"
  [class.is-loading]="loading()"
  [class.is-error]="!!error()"
  role="region"
  aria-live="polite"
  [attr.aria-busy]="loading()"
  data-testid="quote-card"
>
  @if (loading()) {
    <div class="state state--loading" role="status" aria-live="polite">
      <div class="skeleton-card" aria-hidden="true">
        <div class="skeleton skeleton--line skeleton--lg"></div>
        <div class="skeleton skeleton--line"></div>
        <div class="skeleton skeleton--line skeleton--sm"></div>
        <div class="skeleton skeleton--pill"></div>
      </div>
      <p>Loading a fresh quote…</p>
    </div>
  } @else if (error()) {
    <div class="state state--error">
      <p class="error-icon">⚠</p>
      <p class="error-message" data-testid="quote-error">{{ error() }}</p>
      <button
        type="button"
        class="btn btn--ghost"
        (click)="retry.emit()"
        data-testid="retry-btn"
      >
        Try Again
      </button>
    </div>
  } @else if (quote(); as q) {
    <div class="quote-content">
      <span class="quote-mark quote-mark--open" aria-hidden="true">"</span>
      <blockquote class="quote-text" data-testid="quote-text">{{ q.content }}</blockquote>
      <span class="quote-mark quote-mark--close" aria-hidden="true">"</span>
      <div class="quote-meta">
        <span class="quote-dash">—</span>
        <cite class="quote-author" data-testid="quote-author">{{ q.author }}</cite>
        @if (q.category) {
          <span class="quote-category" data-testid="quote-category">#{{ q.category }}</span>
        }
      </div>
    </div>
  }
</div>

<!-- Actions -->
@if (!loading() && !error()) {
  <div class="action-row">
    @if (showNewQuote()) {
      <button
        type="button"
        class="btn btn--primary"
        (click)="newQuote.emit()"
        aria-label="Get a new random quote"
        data-testid="new-quote-btn"
      >
        <svg
          class="btn-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        New Quote
      </button>
    }

    @if (quote(); as q) {
      <button
        type="button"
        class="btn btn--ghost"
        [class.is-copied]="copied()"
        (click)="copy.emit()"
        aria-label="Copy quote to clipboard"
        data-testid="copy-btn"
      >
        <svg
          class="btn-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        {{ copied() ? 'Copied!' : 'Copy' }}
      </button>

      <button
        type="button"
        class="btn btn--ghost"
        [class.is-copied]="linkCopied()"
        (click)="copyLink.emit()"
        aria-label="Copy shareable link to this quote"
        title="Copy a link like /quote/7"
        data-testid="copy-link-btn"
      >
        <svg
          class="btn-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
          <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
        </svg>
        {{ linkCopied() ? 'Link copied!' : 'Copy link' }}
      </button>

      <button
        type="button"
        class="btn btn--ghost"
        (click)="shareX.emit()"
        aria-label="Share on X"
        title="Share on X (Ctrl+Alt+T)"
        data-testid="share-x-btn"
      >
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L1.254 2.25H8.08l4.253 5.622L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117z"
          />
        </svg>
        X
      </button>

      <button
        type="button"
        class="btn btn--ghost"
        (click)="shareLinkedIn.emit()"
        aria-label="Share on LinkedIn"
        title="Share on LinkedIn (Ctrl+Alt+L)"
        data-testid="share-linkedin-btn"
      >
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0z"
          />
        </svg>
        LinkedIn
      </button>

      <button
        type="button"
        class="btn btn--ghost"
        (click)="shareFacebook.emit()"
        aria-label="Share on Facebook"
        title="Share on Facebook (Ctrl+Alt+F)"
        data-testid="share-facebook-btn"
      >
        <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"
          />
        </svg>
        Facebook
      </button>
    }
  </div>
}
